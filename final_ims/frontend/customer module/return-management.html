<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockOverflow — Returns Management</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f6fa; --sidebar-bg: #ffffff; --card-bg: #ffffff;
      --border: #e8e9f0; --text-primary: #000000; --text-muted: #6b7280;
      --accent: #2563eb; --accent-light: #eef2ff; --cyan: #00BCD4; --purple: #7C3AED;
      --green: #10b981; --green-light: #d1fae5;
      --red: #ef4444; --red-light: #fee2e2;
      --yellow: #f59e0b; --yellow-light: #fef3c7;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body { background: var(--bg); color: var(--text-primary); display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar { width: 240px; min-height: 100vh; background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; top: 0; left: 0; bottom: 0; }
    .sidebar-logo {
      padding: 16px 24px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      min-height: 66px;
    }
    .sidebar-logo img { height: 30px; width: auto; display: block; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 24px; color: #808080; font-size: 13.5px; cursor: pointer; border-left: 3px solid transparent; text-decoration: none; }
    .nav-item:hover { background: #f0f0f0; color: #000; }
    .nav-item.active { background: #e0ebff; color: #2563eb; border-left-color: var(--accent); font-weight: 600; }
    .nav-icon { font-size: 15px; width: 20px; text-align: center; }
    .nav-group { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: #999; padding: 16px 24px 6px; text-transform: uppercase; }

    /* MAIN */
    .main-wrap { margin-left: 240px; flex: 1; display: flex; flex-direction: column; }

    /* HEADER */
    .header { height: 60px; background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; top: 0; z-index: 10; position: sticky; }
    .breadcrumb { font-size: 12px; color: var(--text-muted); }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

    /* PAGE CONTENT */
    .page-content { padding: 24px 28px; flex: 1; }

    /* Form Container */
    .form-container { max-width: 520px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 2px solid #00BCD4;
      border-radius: 12px;
      padding: 26px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    /* Form Elements */
    .form-label {
      display: block;
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-with-btn {
      display: flex;
      gap: 10px;
    }

    .form-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      background: #fff;
      color: #111827;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(0, 188, 212, 0.15);
    }

    .fetch-btn {
      padding: 10px 18px;
      background: var(--cyan);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .fetch-btn:hover {
      opacity: 0.9;
    }

    .fetch-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .recent-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip-btn {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 14px;
      padding: 2px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn:hover {
      background: #dbeafe;
    }

    .item-check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 10px;
      background: #fafbfc;
      cursor: pointer;
      transition: all 0.2s;
    }

    .item-check-row:hover {
      background: #f0f9fb;
      border-color: var(--cyan);
    }

    .item-check-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--cyan);
    }

    .item-photo {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      background: #f1f2f6;
      flex-shrink: 0;
    }

    .item-fallback {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: #f1f2f6;
      flex-shrink: 0;
    }

    .item-label {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: #1f2937;
    }

    .item-price {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
    }

    .form-select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      background: #fff;
      color: #1f2937;
      outline: none;
      cursor: pointer;
      appearance: none;
      transition: border-color 0.2s;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234b5563' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      padding-right: 36px;
    }

    .form-select:focus {
      border-color: var(--cyan);
    }

    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #fafbfc;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-zone:hover {
      border-color: var(--cyan);
      background: #f0f9fb;
    }

    .upload-icon {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .upload-text {
      font-size: 12.5px;
      color: #64748b;
    }

    .upload-link {
      color: var(--cyan);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .upload-hint {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }

    textarea.form-input {
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, background 0.2s;
    }

    .submit-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .submit-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .history-card {
      border: 1px solid var(--border);
    }

    .toast-box {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      background: #111827;
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      display: none;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="Logo.png" alt="StockOverflow" onerror="this.onerror=null;this.src='../customer%20module/Logo.png';">
    </div>
    <nav style="flex:1;padding:12px 0;">
      <div class="nav-group">Main Menu</div>
      <a class="nav-item" href="consumer-landingpage.html">Dashboard</a>
      <a class="nav-item" href="productsearch.html">Products</a>
      <a class="nav-item" href="orders.html">Orders</a>
      <a class="nav-item active" href="return-management.html">Returns</a>
      <a class="nav-item" href="restockalert.html">Restock Alerts</a>
    </nav>
    <div class="sidebar-logout-wrap" style="margin-top:auto;padding:16px 20px;">
      <button type="button" class="sidebar-logout-btn" onclick="handleLogout()" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#374151;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">
        <span>🚪</span> Logout
      </button>
    </div>
  </aside>

  <div class="main-wrap">

    <!-- HEADER -->
    <header class="header">
      <div class="breadcrumb">
        <a href="consumer-landingpage.html">Dashboard</a> / <span>Return Management</span>
      </div>
      <div class="header-right">
        <div class="avatar" id="headerAvatar">C</div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content">
      <div class="form-container">
        
        <!-- INITIATE RETURN CARD -->
        <div class="card">
          <div class="card-title">↩️ Initiate Return</div>

          <!-- Order number lookup -->
          <div class="form-group">
            <label class="form-label" for="orderInput">Order / Receipt No.</label>
            <div class="input-with-btn">
              <input id="orderInput" class="form-input" type="text" placeholder="e.g. ORD820239 or ORD632591" value="" autocomplete="off">
              <button id="fetchOrderBtn" class="fetch-btn" type="button" onclick="handleFetchClick()">Fetch</button>
            </div>
            <div id="recentOrdersSection" style="margin-top:8px;"></div>
          </div>

          <!-- Items to return -->
          <div class="form-group">
            <label class="form-label">Select items to return:</label>
            <div id="returnItemsList">
              <div style="background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:16px;text-align:center;color:#64748b;font-size:13px;">
                Please enter an Order / Receipt number above and click <strong>Fetch</strong> to load ordered items.
              </div>
            </div>
          </div>

          <!-- Return reason -->
          <div class="form-group">
            <label class="form-label" for="returnReasonSelect">Return Reason</label>
            <select id="returnReasonSelect" class="form-select">
              <option value="Defective / Not Working">Defective / Not Working</option>
              <option value="Wrong Item Received">Wrong Item Received</option>
              <option value="Changed Mind">Changed Mind</option>
              <option value="Not as Described">Not as Described</option>
            </select>
          </div>

          <!-- Item condition -->
          <div class="form-group">
            <label class="form-label" for="itemConditionSelect">Item Condition</label>
            <select id="itemConditionSelect" class="form-select">
              <option value="Sealed / Unopened">Sealed / Unopened</option>
              <option value="Opened but Unused">Opened but Unused</option>
              <option value="Used — Good Condition">Used — Good Condition</option>
              <option value="Damaged">Damaged</option>
            </select>
          </div>

          <!-- Refund method -->
          <div class="form-group">
            <label class="form-label" for="refundMethodSelect">Refund Method</label>
            <select id="refundMethodSelect" class="form-select">
              <option value="Original Payment Method">Original Payment Method</option>
              <option value="Store Credit">Store Credit</option>
              <option value="Gift Card">Gift Card</option>
            </select>
          </div>

          <!-- Evidence images -->
          <div class="form-group">
            <label class="form-label">Evidence Images</label>
            <div class="upload-zone" onclick="document.getElementById('evidenceFileInput').click()">
              <input type="file" id="evidenceFileInput" style="display:none;" accept="image/*" onchange="handleFileSelected(this)">
              <div class="upload-icon">📎</div>
              <div class="upload-text" id="uploadTextDisplay">Drag & drop or <span class="upload-link">browse</span></div>
              <div class="upload-hint" id="uploadHintDisplay">PNG, JPG up to 10MB</div>
            </div>
          </div>

          <!-- Notes -->
          <div class="form-group">
            <label class="form-label" for="returnNotesInput">Notes</label>
            <textarea id="returnNotesInput" class="form-input" placeholder="Additional notes about the return..."></textarea>
          </div>

          <!-- Submit button -->
          <button id="submitReturnBtn" class="submit-btn" type="button" onclick="handleSubmitReturn()">↩️ Submit Return Request</button>
        </div>

        <!-- RETURN HISTORY CARD -->
        <div class="card history-card" style="margin-top:24px;border:1px solid var(--border);">
          <div class="card-title" style="font-weight:700;font-size:16px;margin-bottom:14px;color:#111827;">Your Return Requests</div>
          <div id="submittedReturnsList" class="return-history-list">
            <div class="return-history-empty" style="color:#6b7280;font-size:13px;padding:12px 0;">Loading recent return requests...</div>
          </div>
        </div>

      </div>
    </main>
  </div><!-- /main-wrap -->

  <div id="toastBox" class="toast-box"></div>

  <script>
    window.customReturnsHandled = true;
  </script>
  <script src="../js/api-config.js"></script>
  <script src="../js/commerce-api.js"></script>
  <script src="../js/mockData.js"></script>
  <script src="app-flow.js"></script>
  <script>
    let userReturns = [];
    let userOrders = [];
    let currentFetchedOrder = null;

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      if (!box) return;
      box.textContent = msg;
      box.style.display = 'block';
      clearTimeout(box._tm);
      box._tm = setTimeout(() => { box.style.display = 'none'; }, 2800);
    }

    function handleLogout() {
      localStorage.removeItem('so_session');
      if (window.DB && typeof window.DB.logout === 'function') {
        window.DB.logout();
      }
      window.location.href = '../index.html';
    }

    function handleFileSelected(input) {
      const hint = document.getElementById('uploadHintDisplay');
      if (input.files && input.files[0]) {
        hint.textContent = `Selected: ${input.files[0].name}`;
        showToast('Evidence image attached');
      }
    }

    function getSession() {
      try {
        return JSON.parse(localStorage.getItem('so_session') || 'null');
      } catch (e) {
        return null;
      }
    }

    function updateUserInfo() {
      const session = getSession();
      const av = document.getElementById('headerAvatar');
      if (av && session && session.name) {
        av.textContent = session.name.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
      }
    }

    async function loadUserOrders() {
      try {
        if (window.ImsApi && typeof window.ImsApi.getTransactions === 'function') {
          userOrders = await window.ImsApi.getTransactions().catch(() => []);
        } else if (window.IMS_HTTP && typeof window.IMS_HTTP.request === 'function') {
          userOrders = await window.IMS_HTTP.request('/transactions').catch(() => []);
        } else {
          userOrders = [];
        }
      } catch (_e) {
        userOrders = [];
      }

      renderRecentOrdersChips();
    }

    function renderRecentOrdersChips() {
      const host = document.getElementById('recentOrdersSection');
      if (!host) return;

      if (!userOrders || !userOrders.length) {
        host.innerHTML = '';
        return;
      }

      const returnedOrderIds = new Set((userReturns || []).map(r => String(r.orderId || '').trim().toUpperCase()));

      const chipsHtml = userOrders.slice(0, 4).map(o => {
        const orderId = String(o.orderId || '').trim();
        const isReturned = returnedOrderIds.has(orderId.toUpperCase());
        const badge = isReturned ? ' (Returned)' : '';
        return `<button type="button" class="chip-btn" onclick="selectOrderChip('${orderId}')">${orderId}${badge}</button>`;
      }).join('');

      host.innerHTML = `
        <div style="font-size:11.5px;color:#6b7280;margin-bottom:4px;">Your Orders:</div>
        <div class="recent-chips">${chipsHtml}</div>
      `;
    }

    function selectOrderChip(orderId) {
      const input = document.getElementById('orderInput');
      if (input) {
        input.value = orderId;
        fetchOrderItems(orderId);
      }
    }

    async function loadReturnHistory() {
      const host = document.getElementById('submittedReturnsList');
      if (!host) return;

      try {
        if (window.ImsApi && typeof window.ImsApi.getReturns === 'function') {
          userReturns = await window.ImsApi.getReturns().catch(() => []);
        } else if (window.IMS_HTTP && typeof window.IMS_HTTP.request === 'function') {
          userReturns = await window.IMS_HTTP.request('/returns').catch(() => []);
        } else {
          userReturns = [];
        }
      } catch (_err) {
        userReturns = [];
      }

      if (!userReturns.length) {
        host.innerHTML = '<div style="color:#6b7280;font-size:13px;padding:12px 0;">No return requests submitted yet.</div>';
        return;
      }

      host.innerHTML = userReturns.map(function(r) {
        const status = r.status || 'Pending';
        const isApproved = status.toLowerCase() === 'approved';
        const isRejected = status.toLowerCase() === 'rejected';
        const isExchanged = status.toLowerCase() === 'exchanged';
        const badgeColor = isApproved ? '#16a34a' : isRejected ? '#dc2626' : isExchanged ? '#7c3aed' : '#d97706';
        const badgeBg = isApproved ? '#dcfce7' : isRejected ? '#fee2e2' : isExchanged ? '#f3e8ff' : '#fef3c7';

        return `
          <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px;margin-bottom:12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <div>
                <strong style="font-size:14.5px;color:#111827;">${r.productName || r.product || r.sku || 'Product'}</strong>
                <div style="font-size:12px;color:#6b7280;margin-top:2px;">
                  ${r.orderId ? `Order: <strong>#${r.orderId}</strong> • ` : ''}SKU: ${r.sku || 'N/A'} • ${r.date ? new Date(r.date).toLocaleDateString() : 'Recent'}
                </div>
              </div>
              <span style="background:${badgeBg};color:${badgeColor};padding:4px 10px;border-radius:20px;font-weight:700;font-size:12px;">${status}</span>
            </div>
            <div style="font-size:12.5px;color:#374151;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;">
              <div><strong>Reason:</strong> ${r.reason || '-'}</div>
              <div><strong>Refund Method:</strong> ${r.refundMethod || r.method || 'Original Payment'}</div>
              <div><strong>Condition:</strong> ${r.condition || '-'}</div>
              <div><strong>Settlement:</strong> ₹${Number(r.amount || 0).toLocaleString('en-IN')}</div>
            </div>
            ${r.notes ? `<div style="font-size:12px;color:#6b7280;margin-top:6px;border-top:1px dashed #e5e7eb;padding-top:6px;"><strong>Notes:</strong> ${r.notes}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    async function fetchOrderItems(orderNumToSearch) {
      const itemsContainer = document.getElementById('returnItemsList');
      const submitBtn = document.getElementById('submitReturnBtn');
      const rawInput = (orderNumToSearch || document.getElementById('orderInput')?.value || '').trim();
      const cleanNum = rawInput.replace(/^#/, '').trim().toUpperCase();

      if (!cleanNum) {
        currentFetchedOrder = null;
        if (itemsContainer) {
          itemsContainer.innerHTML = `
            <div style="background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:16px;text-align:center;color:#64748b;font-size:13px;">
              Please enter an Order / Receipt number above and click <strong>Fetch</strong> to load ordered items.
            </div>
          `;
        }
        if (submitBtn) submitBtn.disabled = true;
        return;
      }

      if (itemsContainer) {
        itemsContainer.innerHTML = `<div style="color:#6b7280;font-size:13px;padding:12px 0;">Searching for order ${rawInput}...</div>`;
      }

      await loadReturnHistory();
      if (!userOrders.length) {
        await loadUserOrders();
      }

      // Find order in transactions
      let order = userOrders.find(o => String(o.orderId || '').replace(/^#/, '').trim().toUpperCase() === cleanNum);

      if (!order) {
        try {
          if (window.ImsApi && typeof window.ImsApi.getTransactionByOrderId === 'function') {
            order = await window.ImsApi.getTransactionByOrderId(cleanNum);
          }
        } catch (_e) {}
      }

      if (!order) {
        currentFetchedOrder = null;
        if (itemsContainer) {
          itemsContainer.innerHTML = `
            <div style="background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:8px;padding:14px 16px;font-size:13px;">
              <strong>Order Not Found</strong>
              <p style="margin-top:4px;font-size:12px;">We could not find an order matching "<strong>${rawInput}</strong>". Please check the number and try again.</p>
            </div>
          `;
        }
        if (submitBtn) submitBtn.disabled = true;
        return;
      }

      currentFetchedOrder = order;

      // Check if order has already been returned
      const existingReturn = (userReturns || []).find(r => 
        String(r.orderId || '').replace(/^#/, '').trim().toUpperCase() === String(order.orderId || '').replace(/^#/, '').trim().toUpperCase()
      );

      if (existingReturn) {
        const retStatus = existingReturn.status || 'Pending';
        if (itemsContainer) {
          itemsContainer.innerHTML = `
            <div style="background:#fef3c7;border:1px solid #fde68a;color:#92400e;padding:14px 16px;border-radius:8px;font-size:13px;">
              <div style="display:flex;align-items:center;justify-content:space-between;">
                <strong>⚠️ Return Request Already Submitted</strong>
                <span style="background:#fef08a;color:#854d0e;padding:2px 8px;border-radius:12px;font-weight:700;font-size:11px;">${retStatus}</span>
              </div>
              <p style="margin-top:6px;font-size:12px;line-height:1.4;">
                A return request for Order <strong>#${order.orderId}</strong> (${existingReturn.productName || existingReturn.sku}) has already been submitted on ${existingReturn.date ? new Date(existingReturn.date).toLocaleDateString() : 'recently'}. Only one return request per order is permitted.
              </p>
            </div>
          `;
        }
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.title = 'A return request has already been submitted for this order';
        }
        return;
      }

      // Order is valid and unreturned -> render real items from order
      const items = Array.isArray(order.items) && order.items.length ? order.items : [];

      if (!items.length) {
        if (itemsContainer) {
          itemsContainer.innerHTML = `
            <div style="background:#f9fafb;border:1px solid #e5e7eb;padding:14px;border-radius:8px;font-size:13px;color:#6b7280;">
              No line items found for Order #${order.orderId}.
            </div>
          `;
        }
        if (submitBtn) submitBtn.disabled = true;
        return;
      }

      const querySku = new URLSearchParams(window.location.search).get('sku');
      const orderDate = order.timestamp ? new Date(order.timestamp).toLocaleDateString() : 'Recent';

      itemsContainer.innerHTML = items.map(function(item, idx) {
        const isChecked = querySku ? String(item.sku).trim() === querySku.trim() : true;
        const itemTotal = Number(item.total || (item.price * item.quantity) || 0);

        return `
          <label class="item-check-row">
            <input type="checkbox" ${isChecked ? 'checked' : ''} data-sku="${item.sku || ''}" data-name="${item.name || 'Product'}" data-price="${item.price || 0}" data-total="${itemTotal}" data-qty="${item.quantity || 1}" onchange="updateSubmitButtonState()">
            <img class="item-photo" src="${item.productImg || ''}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
            <span class="item-fallback" style="${item.productImg ? 'display:none;' : ''}">${item.emoji || '📦'}</span>
            <span class="item-label">
              ${item.name} <span style="color:#6b7280;font-weight:500;">(${item.sku})</span>
              <div style="font-size:11.5px;color:#6b7280;margin-top:2px;">Order #${order.orderId} • Qty: ${item.quantity} • Ordered: ${orderDate}</div>
            </span>
            <span class="item-price">₹${itemTotal.toLocaleString('en-IN')}</span>
          </label>
        `;
      }).join('');

      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.title = '';
      }
    }

    function updateSubmitButtonState() {
      const submitBtn = document.getElementById('submitReturnBtn');
      const anyChecked = document.querySelectorAll('.item-check-row input[type="checkbox"]:checked');
      if (submitBtn) {
        submitBtn.disabled = !anyChecked.length;
      }
    }

    function handleFetchClick() {
      const input = document.getElementById('orderInput');
      if (!input || !input.value.trim()) {
        showToast('Please enter an Order / Receipt number');
        return;
      }
      fetchOrderItems(input.value.trim());
    }

    async function handleSubmitReturn() {
      const submitBtn = document.getElementById('submitReturnBtn');
      if (!currentFetchedOrder) {
        showToast('Please fetch an order first');
        return;
      }

      // Check if order already returned
      const alreadyReturned = (userReturns || []).some(r => 
        String(r.orderId || '').replace(/^#/, '').trim().toUpperCase() === String(currentFetchedOrder.orderId || '').replace(/^#/, '').trim().toUpperCase()
      );

      if (alreadyReturned) {
        showToast('A return request has already been submitted for this order.');
        return;
      }

      const checkedItems = Array.from(document.querySelectorAll('.item-check-row input[type="checkbox"]:checked'));
      if (!checkedItems.length) {
        showToast('Please select at least one item to return');
        return;
      }

      const reason = document.getElementById('returnReasonSelect')?.value || 'Defective / Not Working';
      const condition = document.getElementById('itemConditionSelect')?.value || 'Sealed / Unopened';
      const refundMethod = document.getElementById('refundMethodSelect')?.value || 'Original Payment Method';
      const notes = document.getElementById('returnNotesInput')?.value?.trim() || '';

      const session = getSession();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        for (const chk of checkedItems) {
          const sku = chk.getAttribute('data-sku') || '';
          const productName = chk.getAttribute('data-name') || 'Product';
          const amount = parseFloat(chk.getAttribute('data-total') || chk.getAttribute('data-price') || '0');

          const payload = {
            orderId: currentFetchedOrder.orderId,
            sku: sku,
            productName: productName,
            product: productName,
            amount: amount,
            retailerId: currentFetchedOrder.retailerId || '',
            storeId: currentFetchedOrder.storeId || '',
            store: currentFetchedOrder.store || '',
            reason: reason,
            condition: condition,
            refundMethod: refundMethod,
            method: refundMethod,
            notes: notes,
            customer: session?.name || 'James',
            email: session?.email || 'james@gmail.com',
            customerId: session?.id || undefined,
            status: 'Pending'
          };

          if (window.ImsApi && typeof window.ImsApi.createReturn === 'function') {
            await window.ImsApi.createReturn(payload);
          } else if (window.IMS_HTTP && typeof window.IMS_HTTP.request === 'function') {
            await window.IMS_HTTP.request('/returns', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          }
        }

        showToast('Return request submitted successfully!');
        await loadReturnHistory();
        await renderRecentOrdersChips();
        await fetchOrderItems(currentFetchedOrder.orderId);
      } catch (err) {
        console.error('Failed to submit return:', err);
        const errMsg = err && err.message ? err.message : 'Failed to submit return request';
        showToast(errMsg);
      } finally {
        submitBtn.textContent = '↩️ Submit Return Request';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      updateUserInfo();
      await loadReturnHistory();
      await loadUserOrders();

      const urlParams = new URLSearchParams(window.location.search);
      const queryOrderId = urlParams.get('orderId');
      const querySku = urlParams.get('sku');

      const orderInput = document.getElementById('orderInput');

      if (queryOrderId) {
        if (orderInput) orderInput.value = queryOrderId;
        await fetchOrderItems(queryOrderId);
      } else if (querySku) {
        const matchedOrder = userOrders.find(o => Array.isArray(o.items) && o.items.some(it => String(it.sku).trim() === querySku.trim()));
        if (matchedOrder) {
          if (orderInput) orderInput.value = matchedOrder.orderId;
          await fetchOrderItems(matchedOrder.orderId);
        }
      }

      if (orderInput) {
        orderInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleFetchClick();
          }
        });
      }
    });
  </script>
</body>
</html>
